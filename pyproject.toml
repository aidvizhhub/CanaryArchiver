[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "canaryarchiver"
version = "1.0.0"
description = "Universal fingerprint + watermark + controlled archival engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
canaryarchiver = "canaryarchiver.cli.main:main"

[tool.setuptools.packages.find]
include = ["canaryarchiver*"]
